services:
  yaswarm:
    build: .
    container_name: yaswarm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "6274:6274"
      - "6277:6277"
    volumes:
      - ./catalog:/app/catalog
      - ./mcp:/app/mcp
      - ./skills:/app/skills
      - ./projects:/app/projects
    command: ["sync", "run-forever"]
